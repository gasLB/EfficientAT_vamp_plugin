name: CI

on: [push, pull_request]

env:
  # Enables the sccache GitHub Actions storage backend to keep the compiler cache between builds.
  SCCACHE_GHA_ENABLED: "true"
  # Checks for the '[debug]' string in the commit message to compile as debug instead of release.
  build_type: ${{ contains(github.event.head_commit.message, '[debug]') && 'Debug' || 'Release' }}
  # Checks whether the event corresponds to a tag to activate the automatic creation of a release.
  is_tagged: ${{ startsWith(github.ref, 'refs/tags/') }}
  # The name of the version
  tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || ''}}

jobs:
  # Checks source code formatting with clang before compiling.
  Format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check
      uses: jidicula/clang-format-action@v4.18.0
      with:
        clang-format-version: '22'
        check-path: '.'
  # Creates a cache for the models downloaded from the releases
  # and copied into the Contents directory of the Vamp bundle.
  #Cache:
  #  runs-on: ubuntu-latest
  #  needs: Format
  #  steps:
  #  - uses: actions/checkout@v7
  #    with:
  #      submodules: recursive
  #  - name: Fetch model release metadata
  #    env:
  #        GITHUB_TOKEN: ${{ github.token }}
  #    run: cmake -DOUTPUT_DIR=${{ github.workspace }}/build -DGENERATE_ASSETS_ONLY=ON -P Resources/download_model.cmake
  #  - name: Cache
  #    uses: actions/cache@v6
  #    with:
  #      path: ./build/models
  #      key: models-${{ hashFiles('Resources/download_model.cmake', 'build/ipt_release_assets.json') }}
  #      enableCrossOsArchive: true
  #  - name: Download
  #    env:
  #        GITHUB_TOKEN: ${{ github.token }}
  #    run: cmake -DOUTPUT_DIR=${{ github.workspace }}/build -P Resources/download_model.cmake
  # Compiles, tests and packages the plugin for Ubuntu.
  Ubuntu:
    runs-on: ubuntu-22.04
    needs: Format
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
  #  - name: Fetch model release metadata
  #    env:
  #    GITHUB_TOKEN: ${{ github.token }}
  #    run: cmake -DOUTPUT_DIR=${{ github.workspace }}/build -DGENERATE_ASSETS_ONLY=ON -P Resources/download_model.cmake
  #  - name: Cache
  #    uses: actions/cache@v6
  #    with:
  #      path: ./build/models
  #      key: models-${{ hashFiles('Resources/download_model.cmake', 'build/ipt_release_assets.json') }}
  #      enableCrossOsArchive: true
    - name: Cache
      uses: actions/cache@v6
      with:
        path: ./build/libtorch
        key: ${{ runner.os }}-libtorch-${{ hashFiles('Resources/libtorch.cmake') }}
        enableCrossOsArchive: true
    - uses: seanmiddleditch/gha-setup-ninja@master
    - name: Sccache
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Configure
      run: cmake -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.build_type }} -DCMAKE_C_COMPILER="/usr/bin/clang" -DCMAKE_CXX_COMPILER="/usr/bin/clang++" -DEFFICIENTAT_VAMP_PLUGIN_BUILD_TAG=${{ env.tag_name }} -DEFFICIENTAT_VAMP_PLUGIN_ENABLE_DEBUG=OFF -DEFFICIENTAT_VAMP_PLUGIN_USE_SCCACHE=ON
    - name: Build
      run: cmake --build ${{ github.workspace }}/build
    - name: Test
      run: ctest -C ${{ env.build_type }} -VV --test-dir ${{ github.workspace }}/build
    - name: Package
      run: cmake -E chdir ${{ github.workspace }}/build cmake -E tar cf ${{ github.workspace }}/EfficientAT-Vamp-Linux.zip --format=zip ircamefficientat.vamp
    - name: Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: EfficientAT-Vamp-Linux
        path: ${{ github.workspace }}/EfficientAT-Vamp-Linux.zip
    - name: Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: EfficientAT-Linux
        path: ${{ github.workspace }}/build/EfficientAT
    - name: Release
      uses: softprops/action-gh-release@v3
      if: ${{ env.is_tagged == 'true' }}
      with:
        draft: true
        prerelease: true
        fail_on_unmatched_files: true
        generate_release_notes: true
        body_path: ${{ github.workspace }}/build/efficientat-release.md
        files: |
          ${{ github.workspace }}/package/EfficientAT-Linux.zip
          ${{ github.workspace }}/EfficientAT-Vamp-Linux.zip
