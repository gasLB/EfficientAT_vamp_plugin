        enableCrossOsArchive: true
    - name: Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - uses: seanmiddleditch/gha-setup-ninja@master
    - name: Sccache
      uses: mozilla-actions/sccache-action@v0.0.11
    - name: Configure
      run: cmake -B ${{ github.workspace }}/build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.build_type }} -DEFFICIENTAT_VAMP_PLUGIN_BUILD_TAG="${{ env.tag_name }}" -DEFFICIENTAT_VAMP_PLUGIN_ENABLE_DEBUG=OFF -DEFFICIENTAT_VAMP_PLUGIN_USE_SCCACHE=ON
    - name: Build
      run: cmake --build ${{ github.workspace }}/build
    - name: Test
      run: ctest -C ${{ env.build_type }} -VV --test-dir ${{ github.workspace }}/build
    - name: Package
      run: cmake -E chdir ${{ github.workspace }}/build/${{ env.build_type }} cmake -E tar cf ${{ github.workspace }}/EfficientAT-Vamp-Windows.zip --format=zip ircamefficientat.vamp
    - name: Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: EfficientAT-Vamp-Windows
        path: ${{ github.workspace }}/EfficientAT-Vamp-Windows.zip
    - name: Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: EfficientAT-Windows
        path: ${{ github.workspace }}/package/EfficientAT-Windows.exe
    - name: Release
      uses: softprops/action-gh-release@v3
      if: ${{ env.is_tagged == 'true' }}
      with:
        draft: true
        prerelease: true
        fail_on_unmatched_files: true
        generate_release_notes: true
        body_path: ${{ github.workspace }}/build/efficientat-release.md
        files: |
          ${{ github.workspace }}/package/EfficientAT-Windows.exe
          ${{ github.workspace }}/EfficientAT-Vamp-Windows.zip
